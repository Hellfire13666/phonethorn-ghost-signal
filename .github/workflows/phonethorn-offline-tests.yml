name: PHONETHORN offline tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install published dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -B -m compileall -q phonethorn tests
          python -B -m unittest discover -s tests -v
      - name: Publication privacy guard
        run: python -B scripts/privacy_publication_guard.py
